<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Book Reader | Kitsamba Writes Africa</title>
<meta name="description" content="Read books and local book guides inside Kitsamba Writes Africa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--black:#090909;--panel:#121212;--paper:#f6f0e4;--ink:#211c16;--gold:#d8ac56;--gold2:#f2cf83;--muted:#9b9b9b;--line:rgba(255,255,255,.08);--goldline:rgba(216,172,86,.28)}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}body{font-family:"DM Sans",sans-serif;background:var(--black);color:#fff;line-height:1.7}a{text-decoration:none;color:inherit}button{font:inherit}.container{width:min(1120px,92%);margin:auto}
header{position:sticky;top:0;z-index:1000;background:rgba(8,8,8,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px}.brand-icon{width:40px;height:40px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold)}.brand strong{display:block;font-family:"Playfair Display",serif}.brand span{display:block;color:var(--gold);font-size:.58rem;letter-spacing:2px;text-transform:uppercase}.nav-actions{display:flex;align-items:center;gap:8px}.nav-btn{border:1px solid #333;background:#111;color:#ddd;border-radius:999px;padding:9px 13px;font-size:.76rem;font-weight:800;cursor:pointer}.nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.loading{padding:140px 20px;text-align:center;color:#aaa}.loading i{color:var(--gold);font-size:2.4rem;margin-bottom:17px}.error{padding:130px 20px;text-align:center}.error i{font-size:2.7rem;color:var(--gold);margin-bottom:18px}.error h1{font-family:"Playfair Display",serif;font-size:3rem;margin-bottom:8px}.error p{color:#999;max-width:600px;margin:0 auto 22px}
.book-intro{padding:80px 0 55px;border-bottom:1px solid var(--line);background:radial-gradient(circle at 80% 12%,rgba(216,172,86,.17),transparent 27%)}.intro-grid{display:grid;grid-template-columns:225px 1fr;gap:48px;align-items:center}.cover{aspect-ratio:2/3;padding:22px;border-radius:18px;border:1px solid var(--goldline);background:linear-gradient(145deg,#4a321c,#0c0c0c);display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 28px 65px rgba(0,0,0,.4)}.cover small{color:var(--gold2);text-transform:uppercase;letter-spacing:2px;font-size:.58rem}.cover h2{font-family:"Playfair Display",serif;font-size:1.85rem;line-height:1.02;margin:7px 0}.cover p{color:#aaa;font-size:.68rem}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:3px;font-size:.66rem;font-weight:800;margin-bottom:13px}.book-intro h1{font-family:"Playfair Display",serif;font-size:clamp(3rem,6vw,5.5rem);line-height:.95;margin-bottom:16px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.meta span{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#aaa;font-size:.67rem}.summary{color:#aaa;max-width:720px}.status{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:9px 12px;border-radius:999px;font-size:.68rem;font-weight:800}.status.full{background:rgba(76,175,80,.1);color:#9cd89e;border:1px solid rgba(76,175,80,.25)}.status.guide{background:rgba(216,172,86,.08);color:var(--gold2);border:1px solid var(--goldline)}
.reader-shell{padding:55px 0 95px}.reader-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.reader-top-left strong{font-family:"Playfair Display",serif;font-size:1.25rem}.reader-top-left span{display:block;color:#777;font-size:.68rem}.controls{display:flex;gap:7px;flex-wrap:wrap}.control{width:39px;height:39px;border-radius:10px;border:1px solid #333;background:#111;color:#ddd;display:grid;place-items:center;cursor:pointer}.control:hover{border-color:var(--gold);color:var(--gold)}.progress-track{height:4px;background:#202020;border-radius:999px;margin-bottom:22px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--gold);transition:.25s}
.reader-card{max-width:850px;margin:auto;background:var(--paper);color:var(--ink);min-height:600px;border-radius:8px;padding:clamp(34px,7vw,78px);box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative}.page-number{position:absolute;right:28px;top:24px;color:#9b8f7c;font-size:.65rem}.chapter-label{color:#9b762e;text-transform:uppercase;letter-spacing:2.5px;font-size:.62rem;font-weight:800;margin-bottom:20px}.reader-card h2{font-family:"Playfair Display",serif;font-size:clamp(2rem,4vw,3rem);line-height:1.08;margin-bottom:24px}.page-text{font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;line-height:1.92;white-space:pre-wrap}.page-text p{margin-bottom:1.1em}.guide-note{margin-top:28px;padding:17px 18px;border-left:3px solid var(--gold);background:#efe4cf;color:#675a47;font-family:"DM Sans",sans-serif;font-size:.78rem;line-height:1.6}
.reader-nav{max-width:850px;margin:18px auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.page-btn{border:1px solid #333;background:#111;color:#fff;border-radius:999px;padding:11px 16px;font-weight:800;font-size:.77rem;cursor:pointer}.page-btn:disabled{opacity:.35;cursor:not-allowed}.page-btn:not(:disabled):hover{border-color:var(--gold);color:var(--gold)}.page-count{color:#777;font-size:.72rem;text-align:center}
.library-help{max-width:850px;margin:35px auto 0;padding:22px;border:1px solid var(--goldline);border-radius:18px;background:rgba(216,172,86,.05)}.library-help h3{font-family:"Playfair Display",serif;font-size:1.35rem;margin-bottom:6px}.library-help p{color:#888;font-size:.76rem}.file-path{display:inline-block;margin-top:10px;padding:7px 10px;border-radius:8px;background:#080808;color:var(--gold2);font-family:monospace;font-size:.72rem}
@media(max-width:760px){.intro-grid{grid-template-columns:1fr;text-align:center}.cover{width:min(250px,72%);margin:auto}.meta{justify-content:center}.summary{margin:auto}.reader-top{align-items:flex-start;flex-direction:column}.reader-card{min-height:520px;padding:55px 28px 45px}.reader-nav{flex-wrap:wrap}.page-count{order:3;width:100%}}
</style>
<script src="theme.js"></script>
</head>
<body>
<header><div class="container"><nav class="nav"><a href="index.html" class="brand"><div class="brand-icon"><i class="fa-solid fa-feather-pointed"></i></div><div><strong>Kitsamba Writes</strong><span>Africa</span></div></a><div class="nav-actions"><a class="nav-btn" href="authors.html"><i class="fa-solid fa-arrow-left"></i> Library</a><button class="nav-btn" id="bookmarkBtn" title="Save reading position"><i class="fa-regular fa-bookmark"></i></button></div></nav></div></header>
<main id="app"><div class="loading"><i class="fa-solid fa-book-open fa-beat-fade"></i><p>Opening book from the Kitsamba Writes library…</p></div></main>
<script>
const app=document.getElementById('app');
const id=new URLSearchParams(location.search).get('book');
let meta=null,pages=[],pageIndex=0,fontSize=1.08,isFullText=false;
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

async function getLibrary(){const r=await fetch('books/library.json',{cache:'no-store'});if(!r.ok)throw new Error('library');return r.json()}
async function getLocalText(slug){try{const r=await fetch(`books/texts/${slug}.txt`,{cache:'no-store'});if(!r.ok)return null;const t=await r.text();return t.trim()?t:null}catch(e){return null}}
function splitPlainText(text,max=3300){const paras=text.replace(/\r/g,'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);const out=[];let current='';for(const p of paras){if(current.length+p.length+2>max&&current){out.push(current);current=p}else current+=(current?'\n\n':'')+p}if(current)out.push(current);return out}
function parseText(text){const normalized=text.replace(/\r/g,'');const heading=/^#\s+(.+)$/gm;const matches=[...normalized.matchAll(heading)];if(!matches.length)return splitPlainText(normalized).map((text,i)=>({chapter:`Page ${i+1}`,title:meta.title,text}));const result=[];for(let i=0;i<matches.length;i++){const title=matches[i][1].trim();const start=matches[i].index+matches[i][0].length;const end=i+1<matches.length?matches[i+1].index:normalized.length;const chapterText=normalized.slice(start,end).trim();const pieces=splitPlainText(chapterText);pieces.forEach((text,j)=>result.push({chapter:`Chapter ${i+1}`,title:j===0?title:`${title} · continued`,text}))}return result}
function buildGuide(){const themes=(meta.themes||[]).join(', ');return[
{chapter:'Book Guide',title:'About the story',text:meta.summary},
{chapter:'Book Guide',title:'Why it matters',text:meta.why},
{chapter:'Book Guide',title:'Themes to notice',text:`Key themes: ${themes}.\n\nThis local guide is designed to help readers understand the book before or after reading an authorized copy.`}
]}
function renderShell(){document.title=`${meta.title} | Kitsamba Writes Africa`;app.innerHTML=`<section class="book-intro"><div class="container"><div class="intro-grid"><div class="cover"><small>${esc(meta.country)} · ${esc(meta.type)}</small><h2>${esc(meta.title)}</h2><p>${esc(meta.author)}</p></div><div><div class="eyebrow">Kitsamba Writes Africa · Local reader</div><h1>${esc(meta.title)}</h1><div class="meta"><span><i class="fa-solid fa-user-pen"></i> ${esc(meta.author)}</span><span><i class="fa-solid fa-location-dot"></i> ${esc(meta.country)}</span><span><i class="fa-solid fa-calendar"></i> ${esc(meta.year)}</span><span><i class="fa-solid fa-book"></i> ${esc(meta.type)}</span></div><p class="summary">${esc(meta.summary)}</p><div class="status ${isFullText?'full':'guide'}"><i class="fa-solid ${isFullText?'fa-circle-check':'fa-circle-info'}"></i> ${isFullText?'Full local text loaded':'Local guide available · full text file not added'}</div></div></div></div></section><section class="reader-shell"><div class="container"><div class="reader-top"><div class="reader-top-left"><strong id="readerTitle">${esc(meta.title)}</strong><span id="readerStatus">Reading inside Kitsamba Writes Africa</span></div><div class="controls"><button class="control" id="smaller" title="Smaller text"><i class="fa-solid fa-minus"></i></button><button class="control" id="larger" title="Larger text"><i class="fa-solid fa-plus"></i></button><button class="control" id="firstPage" title="First page"><i class="fa-solid fa-backward-step"></i></button></div></div><div class="progress-track"><div class="progress-bar" id="progress"></div></div><article class="reader-card"><span class="page-number" id="pageNumber"></span><div class="chapter-label" id="chapter"></div><h2 id="pageTitle"></h2><div class="page-text" id="pageText"></div><div class="guide-note" id="guideNote" style="display:${isFullText?'none':'block'}"><strong>Note:</strong> The complete copyrighted text is not stored on this site yet. This reader is currently showing Kitsamba Writes Africa's original local guide. When an authorized <code>${esc(id)}.txt</code> file is added, this same page will automatically become the full book reader.</div></article><div class="reader-nav"><button class="page-btn" id="prev"><i class="fa-solid fa-arrow-left"></i> Previous</button><span class="page-count" id="pageCount"></span><button class="page-btn" id="next">Next <i class="fa-solid fa-arrow-right"></i></button></div>${isFullText?'':`<div class="library-help"><h3>File ready for this book</h3><p>To make this the complete book, add the legally authorized text using this exact repository filename:</p><span class="file-path">books/texts/${esc(id)}.txt</span></div>`}</div></section>`;
wire();renderPage()}
function renderPage(){const p=pages[pageIndex];document.getElementById('chapter').textContent=p.chapter;document.getElementById('pageTitle').textContent=p.title;const box=document.getElementById('pageText');box.textContent=p.text;box.style.fontSize=fontSize+'rem';document.getElementById('pageNumber').textContent=`${pageIndex+1} / ${pages.length}`;document.getElementById('pageCount').textContent=`Page ${pageIndex+1} of ${pages.length}`;document.getElementById('progress').style.width=`${((pageIndex+1)/pages.length)*100}%`;document.getElementById('prev').disabled=pageIndex===0;document.getElementById('next').disabled=pageIndex===pages.length-1;localStorage.setItem(`kw-reading-${id}`,String(pageIndex));window.scrollTo({top:document.querySelector('.reader-shell').offsetTop-65,behavior:'smooth'})}
function wire(){document.getElementById('prev').onclick=()=>{if(pageIndex>0){pageIndex--;renderPage()}};document.getElementById('next').onclick=()=>{if(pageIndex<pages.length-1){pageIndex++;renderPage()}};document.getElementById('firstPage').onclick=()=>{pageIndex=0;renderPage()};document.getElementById('larger').onclick=()=>{fontSize=Math.min(1.55,fontSize+.08);renderPage()};document.getElementById('smaller').onclick=()=>{fontSize=Math.max(.82,fontSize-.08);renderPage()};document.getElementById('bookmarkBtn').onclick=()=>{localStorage.setItem(`kw-bookmark-${id}`,String(pageIndex));const i=document.querySelector('#bookmarkBtn i');i.className='fa-solid fa-bookmark'};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&pageIndex<pages.length-1){pageIndex++;renderPage()}if(e.key==='ArrowLeft'&&pageIndex>0){pageIndex--;renderPage()}})}
async function init(){try{if(!id)throw new Error('missing');const lib=await getLibrary();meta=lib[id];if(!meta)throw new Error('missing');const text=await getLocalText(id);isFullText=!!text;pages=text?parseText(text):buildGuide();const saved=parseInt(localStorage.getItem(`kw-reading-${id}`),10);if(Number.isInteger(saved)&&saved>=0&&saved<pages.length)pageIndex=saved;renderShell()}catch(e){app.innerHTML=`<section class="error"><i class="fa-solid fa-book-open"></i><h1>Book not found</h1><p>This book is not yet registered in the local Kitsamba Writes library.</p><a class="nav-btn" href="authors.html">Return to Authors & Books</a></section>`}}
init();
</script>
</body>
</html>
